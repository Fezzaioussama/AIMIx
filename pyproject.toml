[project]
name = "aimix"
version = "0.1.0"
description = "AI pipeline builder — chain multi-step LLM workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django",
    "djangorestframework",
    "django-cors-headers",
    "djangorestframework-simplejwt",
    "python-dotenv>=1.0.0",
    "openai>=2.24.0",
    "together>=1.5.26",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["backend/api/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "SIM",  # simplify
    "RET",  # return consistency
    "TID",  # tidy imports
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    "B008",    # DRF decorators legitimately call functions in defaults
    "RUF012",  # Django class attrs are not immutable by convention
]

[tool.ruff.lint.per-file-ignores]
"backend/*/tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "llm"]

[tool.mypy]
python_version = "3.10"
# backend/ is the import root: `api`, `llm` and `config` are top-level there.
mypy_path = "backend"
files = ["backend/api", "backend/llm", "backend/config"]
exclude = "backend/api/migrations"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["together.*"]
ignore_missing_imports = true


[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
