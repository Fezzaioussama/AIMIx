[project]
name = "aimix"
version = "0.1.0"
description = "AI pipeline builder — chain multi-step LLM workflows (FastAPI + React)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "exceptiongroup>=1.2",
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openrouter>=0.2.9",
    "langchain-together>=0.4.0",
    "langgraph>=1.2.12",
    "openai>=2.24.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.0",
    "together>=1.5.26",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return consistency
    "TID",  # tidy imports
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    "B008",    # FastAPI dependencies are declared as calls in parameter defaults
]

[tool.ruff.lint.per-file-ignores]
"backend/*/tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "llm", "migrations"]

[tool.mypy]
python_version = "3.10"
# backend/ is the import root: `api`, `llm` and `config` are top-level there.
mypy_path = "backend"
files = ["backend/api", "backend/llm", "backend/config", "backend/migrations"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["together.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
