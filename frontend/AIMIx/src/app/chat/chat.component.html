<div class="chat-container">
  <div class="chat-header">
    <div class="logo">
      <span class="logo-text">AI</span>Mix
    </div>
    <div class="status">
      <span class="status-dot"></span> Online
    </div>
  </div>

  <div class="chat-messages">
    <div *ngFor="let msg of messages" [class]="'message-wrapper ' + msg.sender">
      <div class="message-bubble">
        <div *ngIf="msg.sender === 'ai' && msg.safeHtml" [innerHTML]="msg.safeHtml"></div>
        <div *ngIf="msg.sender === 'user' || !msg.safeHtml">{{ msg.text }}</div>
        <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>
    </div>
    <div *ngIf="isLoading" class="message-wrapper ai">
      <div class="message-bubble typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..."
        [disabled]="isLoading">
      <button (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
