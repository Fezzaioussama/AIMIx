# Continuous integration. Railway deploys main only after this passes
# ("Wait for CI" on the service, see docs/deployment.md).
# Actions are pinned to a commit (the tag in the comment); Dependabot updates both.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Python comes from .python-version (as in the Dockerfile); dependencies from uv.lock.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # as in the Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci --prefix frontend
      # The same single command as locally (AGENTS.md §9), so the two cannot drift.
      - name: make check
        run: make check

  # Known vulnerabilities in the locked dependencies (docs/deployment.md).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # What the image installs (no dev group), at the versions uv.lock pins. Every
      # transitive package is listed, so pip-audit only looks them up (--no-deps).
      - name: Python packages (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" \
            --no-deps --disable-pip --progress-spinner off
      # The whole lockfile, dev dependencies included: Vite, Rollup and esbuild build
      # the bundle the browser runs. High and critical advisories fail the job.
      - name: npm packages (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-not-a-secret-but-long-enough-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -t aimix:ci .
      # Like Railway: a volume owned by root, holding a folder an earlier run as root
      # made (not empty, so Docker does not copy the image's /data owner onto it).
      # The image starts as root only to hand it over, then serves as uid 10001.
      - name: Smoke test (started as root)
        run: |
          docker run --rm -v aimix-data:/seed --entrypoint mkdir aimix:ci /seed/workspace
          docker run -d --name aimix -p 8000:8000 -v aimix-data:/data \
            -e SECRET_KEY -e ALLOWED_HOSTS=localhost aimix:ci
          for _ in $(seq 60); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/health | grep -q '"ok"'
          curl -fsS localhost:8000/settings | grep -q '<div id="root">'
          docker exec aimix grep -Eq '^Uid:\s+10001\s+10001\s+10001\s+10001$' /proc/1/status
          for path in /data /data/workspace /data/aimix.sqlite3; do
            test "$(docker exec aimix stat -c %u:%g "$path")" = 10001:10001
          done
      # Started as the app user, on the volume it now owns, without a proxy in front.
      - name: Smoke test (started as uid 10001)
        run: |
          docker rm -f aimix
          docker run -d --name aimix --user 10001 -p 8000:8000 -v aimix-data:/data \
            -e SECRET_KEY -e ALLOWED_HOSTS=localhost -e TRUSTED_PROXY_HOPS=0 aimix:ci
          for _ in $(seq 60); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/health | grep -q '"ok"'
          docker exec aimix grep -Eq '^Uid:\s+10001\s+10001\s+10001\s+10001$' /proc/1/status
      - name: Container logs
        if: failure()
        run: docker logs aimix
